<!DOCTYPE html>
<!-- ↑ 告訴瀏覽器：這是一份 HTML5 文件（永遠放第一行） -->
<!-- 整份文件的最外層；lang="zh-Hant" = 繁體中文 -->
<html lang="zh-Hant">
<!-- ===== head：給瀏覽器看的設定，不會顯示在畫面上 ===== -->
<head>
  <!-- 文字編碼用 UTF-8，中文和 emoji 才不會變亂碼 -->
  <meta charset="UTF-8">
  <!-- 讓手機用正常大小顯示網頁 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ✏️ 改這裡：瀏覽器分頁上顯示的標題 -->
  <title>簡妤珊的網路名片</title>
  <!-- 借穿的衣服（W3 你會自己做）。這行先不要動！ -->
  <link rel="stylesheet" href="theme.css">
</head>
<!-- ===== body：從這裡開始，才是畫面上看得到的內容 ===== -->

<!-- ✏️ 改這裡：換主題！可以填 theme-neon、theme-notebook、theme-minimal -->
<body class="theme-neon">

  <!-- ✏️ 改這裡：把 images/avatar.svg 換成你的照片，例如 images/me.jpg -->
  <img src="images/S__28950531.jpg" alt="簡妤珊的的大頭貼">

  <!-- ✏️ 改這裡：你的名字（整頁最重要的標題只能有一個 h1） -->
  <h1>嗨，我是簡妤珊 👋</h1>
  <p>資訊傳播學系一年級 ｜ <em>正在學寫網頁的新手村村民</em></p>

  <hr>

  <h2>🙋 關於我</h2>
  <!-- ✏️ 改這裡：用 2～3 句話介紹自己，<strong> 包住你想強調的字 -->
  <p>來自<strong>內壢</strong>，每天都在<strong>我好餓</strong><br>
     最近的目標是：<strong>減肥計畫開始了!!!</strong>！</p>

  <h2>💖 我喜歡的東西</h2>
  <!-- ✏️ 改這裡：寫下你的興趣，一行一個 -->
  <p>🧋 我要喝冰淇淋烏龍奶微糖微冰加珍珠加椰果</p>
  <p>🩷 我喜歡粉紅色 </p>
  <p>🛝 我是Susan</p>
  <p>🍰🍨🍩🍫🍮 我想吃甜的東西</p>

  <h2>🎯 這學期想完成的事</h2>
  <p>每週做出一個作品，學期末把它們全部放進<em>我的網路基地</em>。</p>

  <hr>

  <h2>📮 找到我</h2>
  <!-- ✏️ 改這裡：換成你自己的網址（不想公開也可以先放學校網站） -->
  <p>
    <a href="https://www.instagram.com/3han.u__?srtk=bm9ybnZoN3FzdA%3D%3D&utm_source=qr" target="_blank">Instagram</a> ・
    <a href="https://github.com/Susan313233" target="_blank">GitHub</a>
  </p>
  <!-- 頁尾小字：small 用來放版權、附註 -->
  <p><small>© 2026 簡妤珊 ・ 用 HTML 親手做的第一個網頁</small></p>
